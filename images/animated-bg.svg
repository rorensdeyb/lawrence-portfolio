    </g>
    <g class="vayro-blob-drift-2">
      <path class="vayro-blob vayro-blob-2 vayro-blob-wobble-2" style="--wob-from-deg:4.18deg;--wob-to-deg:-4.18deg;--wob-from-s:0.974;--wob-to-s:1.026;" d="M 1500.33 237.60 C 1499.17 261.18 1485.33 288.70 1468.87 304.87 C 1452.42 321.05 1425.01 333.64 1401.60 334.63 C 1378.19 335.62 1345.46 326.98 1328.39 310.81 C 1311.33 294.63 1299.58 262.39 1299.19 237.60 C 1298.79 212.81 1308.97 179.12 1326.04 162.04 C 1343.11 144.95 1376.64 134.86 1401.60 135.09 C 1426.56 135.32 1459.34 146.32 1475.80 163.40 C 1492.25 180.49 1501.48 214.02 1500.33 237.60 Z" fill="none" stroke="rgb(186,230,253)" stroke-width="8.16" stroke-opacity="1.000" stroke-linejoin="round" filter="url(#vayro-blob-blur-2)"/>
