      <path class="vayro-blob vayro-blob-3 vayro-blob-wobble-3" style="--wob-from-deg:-3.21deg;--wob-to-deg:3.21deg;--wob-from-s:0.972;--wob-to-s:1.028;" d="M 726.63 810.00 C 725.24 839.55 701.59 871.98 679.68 894.48 C 657.78 916.99 624.50 943.89 595.20 945.03 C 565.90 946.17 523.92 923.82 503.88 901.32 C 483.84 878.81 474.93 840.40 474.97 810.00 C 475.00 779.60 484.07 739.22 504.11 718.91 C 524.15 698.61 564.55 688.47 595.20 688.17 C 625.85 687.88 666.13 696.86 688.04 717.16 C 709.94 737.47 728.02 780.45 726.63 810.00 Z" fill="none" stroke="rgb(147,197,253)" stroke-width="8.16" stroke-opacity="1.000" stroke-linejoin="round" filter="url(#vayro-blob-blur-3)"/>
    </g>
    <g class="vayro-blob-drift-4">
      <path class="vayro-blob vayro-blob-4 vayro-blob-wobble-4" style="--wob-from-deg:3.85deg;--wob-to-deg:-3.85deg;--wob-from-s:0.963;--wob-to-s:1.037;" d="M 1444.97 723.60 C 1444.41 748.44 1433.65 779.58 1416.82 796.42 C 1399.99 813.26 1368.44 824.47 1344.00 824.64 C 1319.56 824.80 1287.79 814.23 1270.21 797.39 C 1252.63 780.55 1237.68 747.35 1238.52 723.60 C 1239.36 699.85 1257.69 672.88 1275.27 654.87 C 1292.85 636.86 1319.85 616.78 1344.00 615.53 C 1368.15 614.29 1403.36 629.40 1420.19 647.41 C 1437.02 665.42 1445.53 698.76 1444.97 723.60 Z" fill="none" stroke="rgb(186,230,253)" stroke-width="8.16" stroke-opacity="1.000" stroke-linejoin="round" filter="url(#vayro-blob-blur-4)"/>
    </g>
  </g>
</svg>