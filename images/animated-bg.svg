    <clipPath id="vayro-blob-clip"><rect width="1920" height="1080"/></clipPath>
    <filter id="vayro-blob-blur-1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.08"/></filter>
    <filter id="vayro-blob-blur-2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.08"/></filter>
    <filter id="vayro-blob-blur-3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.08"/></filter>
    <filter id="vayro-blob-blur-4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.08"/></filter>
    <linearGradient id="vayro-blob-bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1080"><stop offset="0%" stop-color="#f0f9ff" stop-opacity="1"/><stop offset="100%" stop-color="#e5f5ff" stop-opacity="1"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#F0F9FF"/>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#vayro-blob-bg)"/>
  <g clip-path="url(#vayro-blob-clip)">
    <g class="vayro-blob-drift-1">
