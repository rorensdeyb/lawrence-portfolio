<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid meet" overflow="hidden" aria-hidden="true" style="--vayro-blob-speed: 2.000;">

  <style>
@keyframes vayro-blob-drift-1 {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(155.78px, 242.23px); }
  50%  { transform: translate(-673.62px, 541.04px); }
  75%  { transform: translate(-22.14px, -287.15px); }
  100% { transform: translate(0, 0); }
}

@keyframes vayro-blob-drift-2 {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(240.05px, 159.12px); }
  50%  { transform: translate(540.44px, 674.11px); }
  75%  { transform: translate(183.26px, -222.17px); }
  100% { transform: translate(0, 0); }
}

@keyframes vayro-blob-drift-3 {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(278.34px, -73.98px); }
  50%  { transform: translate(-432.03px, -748.23px); }
  75%  { transform: translate(-106.79px, 267.47px); }
  100% { transform: translate(0, 0); }
}

@keyframes vayro-blob-drift-4 {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(-3.05px, -287.98px); }
  50%  { transform: translate(351.86px, -789.11px); }
  75%  { transform: translate(-179.06px, 225.57px); }
  100% { transform: translate(0, 0); }
}

@keyframes vayro-blob-wobble {
  0%   { transform: rotate(var(--wob-from-deg)) scale(var(--wob-from-s)); }
  100% { transform: rotate(var(--wob-to-deg))   scale(var(--wob-to-s)); }
}

.vayro-blob-wobble-1 {
  animation: vayro-blob-wobble calc(6.578s * var(--vayro-blob-speed, 1)) ease-in-out infinite alternate;
  animation-delay: calc(0.000s * var(--vayro-blob-speed, 1));
  transform-box: fill-box;
  transform-origin: center;
  animation-play-state: var(--vayro-blob-play-state, running);
  will-change: transform;
}

.vayro-blob-wobble-2 {
  animation: vayro-blob-wobble calc(6.578s * var(--vayro-blob-speed, 1)) ease-in-out infinite alternate;
  animation-delay: calc(-1.644s * var(--vayro-blob-speed, 1));
  transform-box: fill-box;
  transform-origin: center;
  animation-play-state: var(--vayro-blob-play-state, running);
  will-change: transform;
}

.vayro-blob-wobble-3 {
  animation: vayro-blob-wobble calc(6.578s * var(--vayro-blob-speed, 1)) ease-in-out infinite alternate;
  animation-delay: calc(-3.289s * var(--vayro-blob-speed, 1));
  transform-box: fill-box;
  transform-origin: center;
  animation-play-state: var(--vayro-blob-play-state, running);
  will-change: transform;
}

.vayro-blob-wobble-4 {
  animation: vayro-blob-wobble calc(6.578s * var(--vayro-blob-speed, 1)) ease-in-out infinite alternate;
  animation-delay: calc(-4.933s * var(--vayro-blob-speed, 1));
  transform-box: fill-box;
  transform-origin: center;
  animation-play-state: var(--vayro-blob-play-state, running);
  will-change: transform;
}

.vayro-blob-drift-1 {
  animation: vayro-blob-drift-1 calc(30.893s * var(--vayro-blob-speed, 1)) ease-in-out infinite;
  animation-delay: calc(0.000s * var(--vayro-blob-speed, 1));
  animation-play-state: var(--vayro-blob-play-state, running);
  will-change: transform;
}

.vayro-blob-drift-2 {
  animation: vayro-blob-drift-2 calc(30.893s * var(--vayro-blob-speed, 1)) ease-in-out infinite;
  animation-delay: calc(-7.723s * var(--vayro-blob-speed, 1));
  animation-play-state: var(--vayro-blob-play-state, running);
  will-change: transform;
}

.vayro-blob-drift-3 {
  animation: vayro-blob-drift-3 calc(30.893s * var(--vayro-blob-speed, 1)) ease-in-out infinite;
  animation-delay: calc(-15.447s * var(--vayro-blob-speed, 1));
  animation-play-state: var(--vayro-blob-play-state, running);
  will-change: transform;
}

.vayro-blob-drift-4 {
  animation: vayro-blob-drift-4 calc(30.893s * var(--vayro-blob-speed, 1)) ease-in-out infinite;
  animation-delay: calc(-23.170s * var(--vayro-blob-speed, 1));
  animation-play-state: var(--vayro-blob-play-state, running);
  will-change: transform;
}

@media (prefers-reduced-motion: reduce) {
  [class*="vayro-blob-bounce-"],
  [class*="vayro-blob-drift-"],
  [class*="vayro-blob-wobble-"] {
    animation: none !important;
  }
}

  </style>

